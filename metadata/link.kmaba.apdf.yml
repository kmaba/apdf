Description: |
  convert word, powerpoint, images, text and pdf files into a single pdf,
  entirely on your device. no network, no accounts, no tracking. merge any
  mix of files in the order you choose, keep full original quality with no
  re-encoding, and save wherever you pick. share from any app or add files
  directly.

